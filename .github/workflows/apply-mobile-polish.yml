name: Apply site enhancements

on:
  push:
    branches: [main]
    paths:
      - 'mobile-fixes.css'
      - '.github/workflows/apply-mobile-polish.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link site enhancement files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css_tag = '<link rel="stylesheet" href="mobile-fixes.css?v=61">'
          for old in [
              '<link rel="stylesheet" href="mobile-fixes.css?v=55">',
              '<link rel="stylesheet" href="mobile-fixes.css?v=60">'
          ]:
              s = s.replace(old, css_tag)
          if 'mobile-fixes.css' not in s:
              s = s.replace('</head>', css_tag + '\n</head>')

          js_tag = '<script defer src="enhancements.js?v=1"></script>'
          if js_tag not in s:
              s = s.replace('</body>', js_tag + '\n</body>')

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit index wiring if needed
        shell: bash
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Refresh AGAPOVA site assets [skip ci]"
            git push
          fi
