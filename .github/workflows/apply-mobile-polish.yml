name: Apply site enhancements

on:
  push:
    branches: [main]
    paths:
      - 'mobile-fixes.css'
      - 'hero-polish.css'
      - 'hero-refine-v3.css'
      - 'enhancements.js'
      - '.github/workflows/apply-mobile-polish.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link site enhancement files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css_tag = '<link rel="stylesheet" href="mobile-fixes.css?v=61">'
          for old in [
              '<link rel="stylesheet" href="mobile-fixes.css?v=55">',
              '<link rel="stylesheet" href="mobile-fixes.css?v=60">'
          ]:
              s = s.replace(old, css_tag)
          if 'mobile-fixes.css' not in s:
              s = s.replace('</head>', css_tag + '\n</head>')

          hero_css_tag = '<link rel="stylesheet" href="hero-polish.css?v=2">'
          for old in [
              '<link rel="stylesheet" href="hero-polish.css?v=1">'
          ]:
              s = s.replace(old, hero_css_tag)
          if 'hero-polish.css' not in s:
              s = s.replace('</head>', hero_css_tag + '\n</head>')

          refine_css_tag = '<link rel="stylesheet" href="hero-refine-v3.css?v=1">'
          if 'hero-refine-v3.css' not in s:
              s = s.replace('</head>', refine_css_tag + '\n</head>')

          old_hero = '<div class="hero-media"><img alt="AGAPOVA STUDIO" src="assets/images/hero.jpg"/></div>'
          new_hero = '<div class="hero-media"><picture><source media="(max-width:760px)" srcset="assets/images/hero-founder-mobile.jpg?v=20260905b"/><img alt="Олеся Агапова — основательница AGAPOVA STUDIO" src="assets/images/hero-founder-desktop.jpg?v=20260905b" fetchpriority="high" decoding="async"/></picture></div>'
          s = s.replace(old_hero, new_hero)

          js_tag = '<script defer src="enhancements.js?v=4"></script>'
          for old in [
              '<script defer src="enhancements.js?v=1"></script>',
              '<script defer src="enhancements.js?v=2"></script>',
              '<script defer src="enhancements.js?v=3"></script>'
          ]:
              s = s.replace(old, js_tag)
          if 'enhancements.js' not in s:
              s = s.replace('</body>', js_tag + '\n</body>')

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit index wiring if needed
        shell: bash
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Apply AGAPOVA mobile hero and footer polish [skip ci]"
            git push
          fi
