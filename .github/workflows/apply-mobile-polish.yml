name: Apply mobile polish

on:
  push:
    branches: [main]
    paths:
      - 'mobile-fixes.css'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link mobile polish stylesheet
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<link rel="stylesheet" href="mobile-fixes.css?v=55">'
          if tag not in s:
              s = s.replace('</head>', tag + '\n</head>')
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit link if needed
        shell: bash
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Load mobile polish stylesheet [skip ci]"
            git push
          fi
